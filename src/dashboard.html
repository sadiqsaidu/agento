<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agento Dashboard</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap");

  :root {
    --bg: #09090b;
    --surface: #18181b;
    --border: #27272a;
    --text: #ffffff;
    --dim: #a1a1aa;
    --green: #4ade80;
    --green-bg: rgba(74, 222, 128, 0.15);
    --red: #f87171;
    --red-bg: rgba(248, 113, 113, 0.15);
    --yellow: #fbbf24;
    --yellow-bg: rgba(251, 191, 36, 0.15);
    --radius: 20px;
    --font-ui: "Inter", -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .app-container {
    width: 100%;
    max-width: 520px;
    padding: 24px;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }
  .dropdown {
    background: var(--surface);
    padding: 8px 16px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font-mono);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: default;
  }
  .dropdown span { color: var(--dim); }

  .header-actions {
    display: flex; gap: 12px;
  }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  /* ── Hero ── */
  .hero { margin-bottom: 32px; }
  .hero-label {
    font-size: 14px;
    color: var(--dim);
    margin-bottom: 8px;
    font-weight: 500;
  }
  .big-number {
    font-size: 56px;
    font-weight: 700;
    font-family: var(--font-mono);
    letter-spacing: -2px;
    margin-bottom: 16px;
    line-height: 1;
  }
  .chips { display: flex; gap: 8px; }
  .chip {
    background: var(--green-bg);
    color: var(--green);
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font-mono);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chip .dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; }

  .chip.disconnected { background: var(--red-bg); color: var(--red); }
  .chip.disconnected .dot { background: var(--red); }

  /* ── Stats Row (Action Buttons) ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 40px;
  }
  .stat-btn {
    background: var(--surface);
    padding: 18px 8px;
    border-radius: var(--radius);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .stat-icon { font-size: 20px; margin-bottom: 12px; }
  .stat-label { font-size: 11px; color: var(--dim); margin-bottom: 6px; font-weight: 500; }
  .stat-val { font-size: 15px; font-weight: 600; font-family: var(--font-mono); }
  .stat-val.green { color: var(--green); }
  .stat-val.yellow { color: var(--yellow); }
  .stat-val.red { color: var(--red); }

  /* ── Lists ── */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 14px;
    font-family: var(--font-mono);
    color: var(--text);
  }
  .section-action {
    font-size: 12px; color: var(--dim); font-family: var(--font-mono);
  }

  .list-group {
    display: flex; flex-direction: column; gap: 8px; margin-bottom: 40px;
  }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    padding: 16px;
    border-radius: var(--radius);
    display: flex; align-items: center; gap: 16px;
  }
  .card-icon {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.03);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .card-content { flex: 1; min-width: 0; }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: capitalize; }
  .card-sub { font-size: 13px; color: var(--dim); font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-right { text-align: right; flex-shrink: 0; }
  .card-val { font-size: 15px; font-weight: 600; margin-bottom: 4px; font-family: var(--font-mono); }
  .card-val-sub { font-size: 12px; color: var(--dim); font-family: var(--font-mono); }
  
  .card-val.green { color: var(--green); }
  .card-val.yellow { color: var(--yellow); }
  .card-val.red { color: var(--red); }

  /* ── Event Specific ── */
  .event-card .card-title { text-transform: none; }
  .event-card.success .card-icon { background: var(--green-bg); font-size: 16px; }
  .event-card.blocked .card-icon { background: var(--yellow-bg); font-size: 16px; }
  .event-card.error .card-icon { background: var(--red-bg); font-size: 16px; }

  .empty-state {
    text-align: center;
    padding: 32px 0;
    color: var(--dim);
    font-size: 14px;
    background: var(--surface);
    border-radius: var(--radius);
  }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="dropdown">✦ Agento <span>▾</span></div>
    <div class="header-actions">
      <div class="icon-btn">↺</div>
      <div class="icon-btn">⚙</div>
    </div>
  </header>

  <div class="hero">
    <div class="hero-label">Live Operations</div>
    <div id="total-balance" class="big-number">0</div>
    <div class="chips">
      <div class="chip" id="conn-chip"><span class="dot"></span> <span id="status-text">Connected</span></div>
      <div class="chip" style="background: rgba(255,255,255,0.05); color: var(--dim);">
        <span>◎</span> Devnet
      </div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-btn">
      <div class="stat-icon">✅</div>
      <div class="stat-label">Success</div>
      <div class="stat-val green" id="s-ok">0</div>
    </div>
    <div class="stat-btn">
      <div class="stat-icon">🛡️</div>
      <div class="stat-label">Blocked</div>
      <div class="stat-val yellow" id="s-blocked">0</div>
    </div>
    <div class="stat-btn">
      <div class="stat-icon">❌</div>
      <div class="stat-label">Errors</div>
      <div class="stat-val red" id="s-err">0</div>
    </div>
    <div class="stat-btn">
      <div class="stat-icon">⚡</div>
      <div class="stat-label">Avg ms</div>
      <div class="stat-val" id="s-avg">0</div>
    </div>
  </div>

  <div class="section-header">
    <div class="section-title">💼 Wallets</div>
    <div class="section-action" id="wallet-count">Loading...</div>
  </div>
  <div class="list-group" id="wallet-list">
    <div class="empty-state">Loading...</div>
  </div>

  <div class="section-header">
    <div class="section-title">📡 Activity</div>
    <div class="section-action">Live</div>
  </div>
  <div class="list-group" id="feed-inner">
    <div class="empty-state">Waiting for agent activity...</div>
  </div>
</div>

<script>
(function () {
  const API = window.location.origin;

  // ── State ──
  let stats = { ok: 0, blocked: 0, err: 0, totalMs: 0 };
  let firstEvent = true;

  // ── DOM refs ──
  const $connChip = document.getElementById("conn-chip");
  const $statusText = document.getElementById("status-text");
  const $totalBalance = document.getElementById("total-balance");
  const $walletCount = document.getElementById("wallet-count");
  const $walletList = document.getElementById("wallet-list");
  const $feedInner = document.getElementById("feed-inner");
  const $sOk = document.getElementById("s-ok");
  const $sBlocked = document.getElementById("s-blocked");
  const $sErr = document.getElementById("s-err");
  const $sAvg = document.getElementById("s-avg");

  // ── Helpers ──
  function fmtTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString("en-US", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function escHtml(s) {
    const d = document.createElement("div"); d.textContent = s; return d.innerHTML;
  }

  function updateStats() {
    $sOk.textContent = stats.ok;
    $sBlocked.textContent = stats.blocked;
    $sErr.textContent = stats.err;
    const total = stats.ok + stats.blocked + stats.err;
    $sAvg.textContent = total > 0 ? Math.round(stats.totalMs / total) : 0;
    $totalBalance.textContent = total;
  }

  // ── Wallets ──
  async function loadWallets() {
    try {
      const res = await fetch(API + "/wallets");
      const data = await res.json();
      const wallets = data.wallets || [];
      $walletCount.textContent = wallets.length + " Total";

      if (wallets.length === 0) {
        $walletList.innerHTML = "<div class="empty-state">No wallets yet</div>";
        return;
      }

      $walletList.innerHTML = "";
      wallets.forEach(function (w, i) {
        const el = document.createElement("div");
        el.className = "card";
        const short = w.address.slice(0, 4) + "…" + w.address.slice(-4);
        const date = new Date(w.created_at).toLocaleDateString();
        el.innerHTML =
          "<div class="card-icon">💳</div>" +
          "<div class="card-content">" +
            "<div class="card-title">Wallet " + (w.id.slice(0,4)) + "</div>" +
            "<div class="card-sub">" + short + "</div>" +
          "</div>" +
          "<div class="card-right">" +
            "<div class="card-val var(--text)">—</div>" +
            "<div class="card-val-sub">" + date + "</div>" +
          "</div>";
        $walletList.appendChild(el);
      });
    } catch (e) {
      $walletList.innerHTML = "<div class="empty-state">Failed to load</div>";
    }
  }

  // ── Event feed ──
  function addEvent(event) {
    if (firstEvent) {
      $feedInner.innerHTML = "";
      firstEvent = false;
    }

    if (event.status === "success") stats.ok++;
    else if (event.status === "blocked") stats.blocked++;
    else stats.err++;
    stats.totalMs += event.durationMs || 0;
    updateStats();

    const isSuccess = event.status === "success";
    const isBlocked = event.status === "blocked";

    const el = document.createElement("div");
    el.className = "card event-card " + event.status;
    const icon = isSuccess ? "✅" : isBlocked ? "🛡️" : "❌";
    const valClass = isSuccess ? "green" : isBlocked ? "yellow" : "red";

    let summary = event.summary;

    el.innerHTML =
      "<div class="card-icon">" + icon + "</div>" +
      "<div class="card-content">" +
        "<div class="card-title">" + event.tool + "</div>" +
        "<div class="card-sub">" + escHtml(summary) + "</div>" +
      "</div>" +
      "<div class="card-right">" +
        "<div class="card-val " + valClass + "">" + (event.durationMs || 0) + "ms</div>" +
        "<div class="card-val-sub">" + fmtTime(event.timestamp) + "</div>" +
      "</div>";

    $feedInner.insertBefore(el, $feedInner.firstChild);
    
    // Prevent feed from growing infinitely
    if ($feedInner.children.length > 50) {
      $feedInner.lastChild.remove();
    }
  }

  // ── SSE ──
  function connectSSE() {
    const es = new EventSource(API + "/events");

    es.addEventListener("tool", function (e) {
      try { addEvent(JSON.parse(e.data)); } catch (_) {}
    });

    es.onopen = function () {
      $connChip.className = "chip";
      $statusText.textContent = "Connected";
    };

    es.onerror = function () {
      $connChip.className = "chip disconnected";
      $statusText.textContent = "Disconnected";
    };
  }

  // ── Init ──
  loadWallets();
  connectSSE();
  setInterval(loadWallets, 30000);
})();
</script>
</body>
</html>
