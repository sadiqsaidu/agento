services:
  - type: web
    name: agento
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: KEYSTORE_DIR
        value: ./wallets
      - key: NODE_ENV
        value: production
